name: medrag

services:
  api:
    image: ${MEDRAG_API_IMAGE:-medrag-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MEDRAG_ENV: ${MEDRAG_ENV:-docker}
      MEDRAG_DATA_DIR: /app/med-rag-data
      MEDRAG_ARTIFACT_DIR: /app/artifacts
      MEDRAG_DB_PATH: /app/artifacts/medrag.sqlite3
      MEDRAG_CORS_ORIGINS: ${MEDRAG_CORS_ORIGINS:-*}
      MEDRAG_LLM_PROVIDER: ${MEDRAG_LLM_PROVIDER:-template}
      MEDRAG_LLM_API_KEY: ${MEDRAG_LLM_API_KEY:-}
      MEDRAG_LLM_BASE_URL: ${MEDRAG_LLM_BASE_URL:-}
      MEDRAG_LLM_MODEL: ${MEDRAG_LLM_MODEL:-}
      MEDRAG_API_KEY: ${MEDRAG_API_KEY:-}
      MEDRAG_API_HOST: 0.0.0.0
      MEDRAG_API_PORT: 8000
    volumes:
      - medrag_artifacts:/app/artifacts
    expose:
      - "8000"
    ports:
      - "127.0.0.1::8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${MEDRAG_WEB_IMAGE:-medrag-web:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    ports:
      - "127.0.0.1::80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    profiles: ["compose-proxy"]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  medrag_artifacts:
  caddy_data:
  caddy_config:
